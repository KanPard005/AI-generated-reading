<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class }}">
<a class="skip-link" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
<footer class="site-footer">
  <p>{{ site.title }} · {{ site.tagline }} Articles are AI-generated; verify anything important.</p>
</footer>
<script src="{{ '/assets/js/common.js' | relative_url }}"></script>
{%- for s in page.scripts %}
<script src="{{ s | relative_url }}" defer></script>
{%- endfor %}
</body>
</html>
